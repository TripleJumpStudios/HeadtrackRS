[package]
name = "headtrack-tobii-device"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tobii eye-tracker USB device layer (ported from TobiiLab tobii-device): wire decoding, live acquisition worker, replay"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
csv = "1.4"
nusb = "=0.2.7"
tracing = { workspace = true }
