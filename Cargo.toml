[workspace]
members = [
    "crates/headtrack-core",
    "crates/headtrack-engine",
    "crates/headtrack-ipc",
    "crates/headtrack-daemon",
    "crates/headtrack-xplane",
    "crates/headtrack-input-neuralnet",
    "crates/headtrack-input-smoothtrack",
    "crates/headtrack-input-linuxtrack",
    "crates/headtrack-output-wine",
    "crates/headtrack-output-udp",
    "crates/headtrack-output-simconnect",
    "crates/headtrack-tester",
    "crates/headtrack-gui",
    "crates/headtrack-tobii-device",
    "crates/headtrack-input-tobii",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

# Optimize external deps in debug builds — critical for image processing throughput.
# Pure-Rust JPEG decode (nokhwa + image crate) is 5-10x slower at opt-level=0,
# which drops the C920 from ~30 Hz to ~17 Hz.  opt-level=1 for workspace code
# helps to_gray() and other hot loops without significantly increasing build time.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# tract-tflite 0.23.6 needs two narrow import additions (constant float16
# DEQUANTIZE promotion, PReLU composition) for the Tobii head models; the patched
# snapshot is in-repo and pinned by vendor/tract-tflite/TRACT_SNAPSHOT.json
# (headtrack-input-tobii's test `tract_snapshot_hashes_verify` checks it).
[patch.crates-io]
tract-tflite = { path = "vendor/tract-tflite" }

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros", "signal", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Linear algebra — used by the PnP solver and optical-flow tracker in
# headtrack-input-neuralnet. Pinned at workspace level so future crates picking
# this up share a single version.
nalgebra = "0.34"
