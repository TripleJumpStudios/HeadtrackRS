# Cross-compilation configuration for the headtrack-npclient Windows crate
# (built with --target x86_64-pc-windows-gnu).
#
# It is NOT a workspace member and must be built explicitly:
#   cargo build --manifest-path crates/headtrack-npclient/Cargo.toml \
#       --target x86_64-pc-windows-gnu --release
#
# Requires: sudo dnf install mingw64-gcc

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
rustflags = ["-C", "target-feature=+crt-static"]
